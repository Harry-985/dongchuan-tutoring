<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 昆明市东川区助学平台</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 32px 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        .login-box h1 { font-size: 24px; margin-bottom: 4px; }
        .login-box p { font-size: 14px; color: #6B7280; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
        }
        input:focus { border-color: #4F46E5; }
        button {
            width: 100%;
            padding: 14px;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
        }
        .error { color: #EF4444; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 管理员登录</h1>
        <p>请输入后台管理密码</p>
        <form method="post">
            <input type="password" name="password" placeholder="输入密码" autofocus>
            <button type="submit">登录</button>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
        </form>
    </div>
</body>
</html>
