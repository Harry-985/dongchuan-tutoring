<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 东川家教信息栏</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #F9FAFB;
            color: #1F2937;
        }
        header {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 18px; }
        header a { color: white; font-size: 13px; text-decoration: none; opacity:0.8; }
        .toolbar {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background: #4F46E5; color: white; }
        .btn-danger { background: #FEE2E2; color: #EF4444; font-size:12px; padding: 6px 12px; }
        .btn-small { background: #EEF2FF; color: #4F46E5; font-size:12px; padding: 6px 12px; border-radius:6px; text-decoration:none; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        thead th {
            text-align: left;
            padding: 10px 12px;
            font-size: 12px;
            color: #6B7280;
            background: #F9FAFB;
            border-bottom: 2px solid #E5E7EB;
        }
        tbody td {
            padding: 10px 12px;
            font-size: 14px;
            border-bottom: 1px solid #F3F4F6;
        }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-inactive { background: #F3F4F6; color: #9CA3AF; }
        .actions { display: flex; gap: 6px; }
        .container { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ 老师管理</h1>
            <div>
                <a href="/" target="_blank">预览前台</a> ·
                <a href="/logout">退出</a>
            </div>
        </header>
        <div class="toolbar">
            <span style="font-size:13px;color:#6B7280;">共 {{ teachers|length }} 位老师</span>
            <a href="/admin/add" class="btn btn-primary">+ 添加老师</a>
        </div>
        <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>性别</th>
                    <th>科目</th>
                    <th>年级</th>
                    <th>价格/h</th>
                    <th>地区</th>
                    <th>评分</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for t in teachers %}
                <tr>
                    <td><strong>{{ t.name }}</strong></td>
                    <td>{{ t.gender or '-' }}</td>
                    <td>{{ t.subjects }}</td>
                    <td>{{ t.grades }}</td>
                    <td>¥{{ t.price_per_hour }}</td>
                    <td>{{ t.location }}</td>
                    <td>{{ t.rating }}</td>
                    <td>
                        <span class="badge {{ 'badge-active' if t.is_active else 'badge-inactive' }}">
                            {{ '上架' if t.is_active else '下架' }}
                        </span>
                    </td>
                    <td>
                        <div class="actions">
                            <a href="/admin/edit/{{ t.id }}" class="btn-small">编辑</a>
                            <a href="/admin/delete/{{ t.id }}" class="btn-danger"
                               onclick="return confirm('确定删除 {{ t.name }} 吗？')">删除</a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
    </div>
</body>
</html>
